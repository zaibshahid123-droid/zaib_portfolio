{% extends "base.html" %}
{% block title %}{{ post.title }} — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto px-6 py-20">
    <a href="{% url 'portfolio:blog_list' %}" class="text-accent hover:underline text-sm">&larr; Back to blog</a>

    <h1 class="text-4xl font-bold text-white mt-6">{{ post.title }}</h1>
    <p class="text-gray-500 text-sm mt-2 font-mono">{{ post.created_at|date:"F j, Y" }}</p>

    {% if post.cover_image %}
        <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="rounded-xl mt-8 w-full object-cover max-h-96">
    {% endif %}

    <div class="prose prose-invert max-w-none mt-8 text-gray-300 leading-relaxed whitespace-pre-line">
        {{ post.content }}
    </div>
</section>
{% endblock %}
